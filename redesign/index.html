<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Paper Crane Wellness — Trauma therapy in South Carolina with Rebekah P. Tozer, LISW-CP. EMDR, Prolonged Exposure, Neurodivergent Affirming Therapy, and Individual Therapy for Adults. Virtual across SC; in-person in Mount Pleasant."
    />
    <meta name="theme-color" content="#24363A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <title>Paper Crane Wellness — Trauma Therapy in South Carolina</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      SimplePractice widget host (hidden).
      These anchors autobind when the SP integration script below runs (deferred,
      so the DOM is parsed and the anchors exist). The React app calls
      window.SPWidgetInstances["<scopeId>-appointment" | "-contact"].reveal()
      to open the modals (see src/lib/simplepractice.ts).
      The real hrefs are the no-JS / no-script fallback.
    -->
    <div id="sp-widget-host" style="display: none">
      <div class="spwidget-button-wrapper">
        <a
          href="https://papercranewellness.clientsecure.me"
          class="spwidget-button"
          data-spwidget-scope-id="ef573a05-79ef-46ab-9b18-d5c65a183d97"
          data-spwidget-scope-uri="papercranewellness"
          data-spwidget-application-id="7c72cb9f9a9b913654bb89d6c7b4e71a77911b30192051da35384b4d0c6d505b"
          data-spwidget-type="OAR"
          data-spwidget-scope-global
          data-spwidget-autobind
        >Request Appointment</a>
      </div>
      <div class="spwidget-button-wrapper">
        <a
          href="https://papercranewellness.clientsecure.me"
          class="spwidget-button"
          data-spwidget-scope-id="ef573a05-79ef-46ab-9b18-d5c65a183d97"
          data-spwidget-scope-uri="papercranewellness"
          data-spwidget-application-id="7c72cb9f9a9b913654bb89d6c7b4e71a77911b30192051da35384b4d0c6d505b"
          data-spwidget-channel="embedded_widget"
          data-spwidget-type="Contact form"
          data-spwidget-contact
          data-spwidget-scope-global
          data-spwidget-autobind
        >Contact</a>
      </div>
    </div>
    <script
      defer
      src="https://widget-cdn.simplepractice.com/assets/integration-1.0.js"
    ></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
